name: PortionNote
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: 'YES'
targets:
  PortionNote:
    type: application
    platform: iOS
    sources:
    - Phone
    - Catalog
    - Shared
    - Companion
    - Config/PrivacyInfo.xcprivacy
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1,2
        PRODUCT_BUNDLE_IDENTIFIER: app.portionnote.food
        INFOPLIST_FILE: Config/Phone.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
    - target: PortionNoteWidget
      embed: true
  PortionNoteWidget:
    type: app-extension
    platform: iOS
    sources:
    - Widget
    - Shared
    - Config/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portionnote.food.widget
        INFOPLIST_FILE: Config/Widget.plist
        CODE_SIGN_ENTITLEMENTS: Config/Shared.entitlements
        TARGETED_DEVICE_FAMILY: 1,2
        SKIP_INSTALL: 'YES'
        APPLICATION_EXTENSION_API_ONLY: 'YES'
  PortionNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portionnote.food.tests
        GENERATE_INFOPLIST_FILE: 'YES'
    dependencies:
    - target: PortionNote
  PortionNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portionnote.food.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: PortionNote
    dependencies:
    - target: PortionNote
schemes:
  PortionNote:
    build:
      targets:
        PortionNote: all
    test:
      targets:
      - PortionNoteTests
      - PortionNoteUITests
  PortionNoteWidget:
    build:
      targets:
        PortionNoteWidget: all
